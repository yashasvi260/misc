# Deploys the Databricks Asset Bundle. This is the only thing that actually
# applies bundle changes to the workspace; nothing here modifies the
# ingestion pipeline's live object list on its own (that's reconcile,
# running daily inside the deployed job).
#
# Manual trigger only, for now -- databricks.yml still has placeholder
# workspace hosts and no DATABRICKS_HOST/DATABRICKS_TOKEN secrets are
# configured, so an automatic push trigger just fails on every commit.
#
# Once both are set up (Settings -> Secrets and variables -> Actions, and
# real hosts in databricks.yml), switch `on:` back to:
#   push:
#     branches: [main]
#     paths:
#       - "databricks/**"
# so merges from generate-ingestion-resource.yml's PRs deploy automatically.
#
# UNVERIFIED: confirm the bundle target here (`prod`) matches what you want
# CI to deploy to -- see databricks.yml for the configured targets.

name: Deploy Databricks bundle

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: databricks
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - run: databricks bundle validate -t prod

      - run: databricks bundle deploy -t prod
